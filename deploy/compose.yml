# dalang - local test only: nginx and php-fpm on http://127.0.0.1:8082. Not a production setup.
# You do not need to start this by hand:  sh deploy/test.sh  starts it, tests and cleans up.
# By hand:  mkdir -p deploy/.testdaten/data && chmod 777 deploy/.testdaten/data
#           podman compose -f deploy/compose.yml up -d      (or docker compose)
#           podman compose -f deploy/compose.yml down
# Login in a browser needs HTTPS or http://localhost:8082 (the session cookie is "Secure").
# The test password is in deploy/test-config.php.
name: dalang-test
services:
  web:
    image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine-slim
    ports: ["127.0.0.1:8082:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  php:
    image: docker.io/library/php:8.5-fpm-alpine3.24
    network_mode: "service:web"      # shared network: nginx reaches PHP at 127.0.0.1:9000
    user: "82:82"                    # www-data in the Alpine image, no root needed
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]
    volumes:
      - ../public:/app/public:ro
      - ../lib.php:/app/lib.php:ro
      - ../lang:/app/lang:ro
      - ./test-config.php:/app/config.php:ro
      - ./.testdaten/data:/data
  e2e:                               # browser test, only started by deploy/e2e.sh
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    network_mode: "service:web"      # the browser reaches nginx at http://localhost:8080, no port of its own
    depends_on: [web, php]
    environment:
      BASE: http://localhost:8080    # localhost: there the browser takes the "Secure" cookie without HTTPS
      NODE_PATH: /tmp/pw/node_modules
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      - ./e2e.js:/e2e/e2e.js:ro
    # The image brings the browsers, not the npm package. Its version must be the version of the image.
    command: ["sh", "-c", "npm install --silent --no-save --prefix /tmp/pw playwright@1.65.0 && node /e2e/e2e.js"]
