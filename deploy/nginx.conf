# dalang - EXAMPLE server block for nginx with php-fpm. Copy it and adjust it, it is not a finished setup.
# The local test (deploy/compose.yml) runs with exactly this file.
# Written for the image nginxinc/nginx-unprivileged (mounted as /etc/nginx/conf.d/default.conf),
# behind a reverse proxy that does TLS. Adjust "listen", the path /app and "fastcgi_pass" to your setup.
#
# The idea: nginx serves no file at all. There are exactly two ways in:
#   /admin/          -> public/admin/index.php
#   everything else  -> public/index.php
# So config.php, the database, .git and all other files can not be fetched, whatever the path looks like.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    # No visitor data: no access log. (The error log stays on. It can contain addresses when something breaks.)
    access_log off;

    # Enough for a CSV import with some thousand links.
    client_max_body_size 2m;

    # Only here, on server level. An add_header inside a location would drop all of these.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        # nginx decodes and cleans the path before it picks a location: /x%2F..%2Fadmin/ ends up here too.
        # A proxy in front may read that path differently. So check the raw address:
        # the admin answers at exactly /admin/ (plus query string) and nowhere else.
        if ($request_uri !~ "^/admin/(\?|$)") {
            return 404;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/admin/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass 127.0.0.1:9000;
    }
}
